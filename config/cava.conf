# Sable CAVA config -- TEST/standalone. Reads Sable's OWN input fifo and writes
# Sable's OWN output fifo. It NEVER references the live plugin's /tmp/cava.fifo
# or /tmp/display.fifo. The real MPD->CAVA wiring is an installer-phase concern.
#
# Output format consumed by display/fifo_meter.py: raw ASCII, ';'-delimited bars,
# '\n'-delimited frames, each value 0..255, `bars` values per frame.

[general]
bars = 24
lower_cutoff_freq = 30
higher_cutoff_freq = 20000
framerate = 30

[input]
method = fifo
source = /tmp/sable-cava.fifo

[output]
method = raw
data_format = ascii
raw_target = /tmp/sable-display.fifo
ascii_max_range = 255
bar_delimiter = 59
frame_delimiter = 10
