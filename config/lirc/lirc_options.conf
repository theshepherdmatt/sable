# Sable LIRC daemon options -- installed to /etc/lirc/lirc_options.conf.
# driver=default + device=/dev/lirc0 reads the kernel gpio-ir receiver (the
# dtoverlay=gpio-ir,gpio_pin=27 that install.sh enables creates /dev/lirc0).
# output=/run/lirc/lircd is the broadcast socket Sable's IR listener reads.
[lircd]
nodaemon = False
driver   = default
device   = /dev/lirc0
output   = /run/lirc/lircd
