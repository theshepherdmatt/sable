# Sable CAVA config -- LIVE. Reads MPD's real PCM fifo (/tmp/cava.fifo, the
# standard Volumio "my_fifo" audio_output, 44100:16:2) and writes ASCII bars to
# Sable's OWN output fifo /tmp/sable-display.fifo. This is the production path:
# Sable's cava REPLACES quadify's cava.service (which reads the same /tmp/cava.fifo
# -> /tmp/display.fifo). Only one reader may drain /tmp/cava.fifo, so quadify's
# cava.service must be stopped when Sable's cava runs.
#
# The separate config/cava.conf is the bench/test variant (reads the synthetic
# test-tone fifo instead). Output format matches display/fifo_meter.py: raw ASCII,
# ';'-delimited bars, '\n'-delimited frames, each value 0..255, `bars` per frame.

[general]
bars = 24
lower_cutoff_freq = 30
higher_cutoff_freq = 20000
framerate = 30

[input]
method = fifo
source = /tmp/cava.fifo

[output]
method = raw
data_format = ascii
raw_target = /tmp/sable-display.fifo
ascii_max_range = 255
bar_delimiter = 59
frame_delimiter = 10
